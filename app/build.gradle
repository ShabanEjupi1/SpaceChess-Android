plugins {
    id 'com.android.application'
}

// Nënshkrimi lexohet nga `key.properties`, të cilin e shkruan CI-ja nga sekretet.
// Nëse skedari mungon (p.sh. një ndërtim lokal për provë), ndërtimi vazhdon i
// panënshkruar në vend që të dështojë — por një AAB i tillë NUK ngarkohet dot te
// Play-i, dhe workflow-i e kontrollon veçmas.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'tech.spacecode.chess'
    compileSdk 35

    defaultConfig {
        applicationId 'tech.spacecode.chess'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Asnjë kod i yni nuk shkurtohet: i gjithë aplikacioni është tre
            // klasa të bibliotekës së Google-it. R8-ja këtu do të shtonte vetëm
            // një mënyrë të re për t'u prishur.
            minifyEnabled false
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // E vetmja varësi. Ajo hap chess.spacecode.tech si Trusted Web Activity:
    // Chrome-i i vërtetë, pa shirit adrese, me të njëjtin motor JavaScript që
    // luan lojën — jo një WebView i ngrirë.
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
